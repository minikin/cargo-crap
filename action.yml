name: cargo-crap
description: Score Rust functions by CRAP (complexity × untested code), compare a pull request with its base, comment and gate.
author: minikin
branding:
  icon: alert-triangle
  color: orange

inputs:
  version:
    description: The cargo-crap release to install, or `latest`. The release this Action was cut with by default.
    default: "0.9.0"
  binary:
    description: A cargo-crap binary, relative to the working directory, to use instead of downloading one.
    default: ""
  working-directory:
    description: Where the crate is.
    default: "."
  args:
    description: Extra arguments for every cargo-crap run, as shell words.
    default: ""
  coverage-args:
    description: Extra arguments for `cargo llvm-cov`, as shell words.
    default: ""
  lcov:
    description: An existing LCOV file, relative to the working directory, used instead of a coverage run.
    default: ""
  baseline:
    description: A baseline JSON file, relative to the working directory, used instead of the base-commit run.
    default: ""
  base:
    description: The commit to compare with. The pull request's base commit by default, and nothing on a push. Ignored when baseline is given.
    default: ${{ github.event.pull_request.base.sha }}
  fail-regression:
    description: Fail when a function's score rose, whenever there is something to compare with (a pull request, or a given baseline).
    default: "true"
  fail-above:
    description: Fail when a function scores above the threshold.
    default: "false"
  comment:
    description: On a pull request, post the report as a comment, or update the one posted before. true or false.
    default: "true"
  comment-marker:
    description: The hidden line that finds the comment again. Give each Action step that comments on one pull request its own.
    default: "<!-- cargo-crap-report -->"
  github-token:
    description: The token that writes the comment.
    default: ${{ github.token }}

outputs:
  crappy:
    description: How many functions score above the threshold.
    value: ${{ steps.score.outputs.crappy }}
  regressed:
    description: On a pull request, how many functions' scores rose.
    value: ${{ steps.score.outputs.regressed }}
  report:
    description: The path of the markdown report.
    value: ${{ steps.score.outputs.report }}

runs:
  using: composite
  steps:
    # Every later step runs from a copy of the scripts, taken before any
    # checkout: with `uses: ./` they sit in the tree the base-commit run
    # replaces.
    - name: Install cargo-crap
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        scripts="$(mktemp -d "$RUNNER_TEMP/cargo-crap-scripts.XXXXXX")"
        cp -R "$GITHUB_ACTION_PATH/scripts/action/." "$scripts/"
        echo "CARGO_CRAP_SCRIPTS=$scripts" >> "$GITHUB_ENV"
        "$scripts/install.sh"
      env:
        VERSION: ${{ inputs.version }}
        BINARY: ${{ inputs.binary }}

    - name: Install cargo-llvm-cov
      if: inputs.lcov == ''
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov

    - name: Add llvm-tools
      if: inputs.lcov == ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: rustup component add llvm-tools-preview

    - name: Score
      id: score
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: "\"$CARGO_CRAP_SCRIPTS/score.sh\""
      env:
        CRAP_ARGS: ${{ inputs.args }}
        CRAP_COVERAGE_ARGS: ${{ inputs.coverage-args }}
        CRAP_FAIL_ABOVE: ${{ inputs.fail-above }}
        CRAP_FAIL_REGRESSION: ${{ inputs.fail-regression }}
        CRAP_BASE: ${{ inputs.base }}
        CRAP_LCOV: ${{ inputs.lcov }}
        CRAP_BASELINE: ${{ inputs.baseline }}
        CRAP_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        CRAP_COMMENT: ${{ inputs.comment }}
        CRAP_COMMENT_MARKER: ${{ inputs.comment-marker }}

    # A fork's read-only token cannot write: one warning, and the report is
    # already in the job summary. CARGO_CRAP_TEST_API_URL and
    # CARGO_CRAP_TEST_PR_NUMBER are this repository's test seams: GitHub does
    # not let a step override GITHUB_API_URL, so its scenario jobs point the
    # comment at a local stand-in through them. Every other repository's job
    # ignores them, so nothing that writes its environment can point the
    # token at another host through them.
    - name: Comment
      if: steps.score.outputs.comment == 'true' && ((github.repository == 'minikin/cargo-crap' && env.CARGO_CRAP_TEST_PR_NUMBER) || github.event.pull_request.number)
      uses: actions/github-script@v8
      env:
        REPORT: ${{ steps.score.outputs.report }}
        MARKER: ${{ inputs.comment-marker }}
        PR_NUMBER: ${{ (github.repository == 'minikin/cargo-crap' && env.CARGO_CRAP_TEST_PR_NUMBER) || github.event.pull_request.number }}
      with:
        github-token: ${{ inputs.github-token }}
        base-url: ${{ (github.repository == 'minikin/cargo-crap' && env.CARGO_CRAP_TEST_API_URL) || github.api_url }}
        script: |
          const fs = require('fs');
          const issue_number = Number(process.env.PR_NUMBER);
          if (!issue_number) {
            core.notice('No pull request to comment on: the report is in the job summary.');
            return;
          }
          // The marker is the comment's whole first line, never a prefix of
          // it, so no other comment can be taken for this one.
          const marker = process.env.MARKER;
          const firstLine = text => (text || '').split('\n', 1)[0].trim();
          let body = fs.readFileSync(process.env.REPORT, 'utf8');
          if (firstLine(body) !== marker) {
            body = `${marker}\n${body}`;
          }
          const { owner, repo } = context.repo;
          try {
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => firstLine(c.body) === marker);
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
          } catch (error) {
            if (error.status === 403 || error.status === 404) {
              core.warning(`Could not comment on the pull request (${error.status}): the report is in the job summary.`);
            } else {
              throw error;
            }
          }

    - name: Gate
      shell: bash
      run: exit "$STATUS"
      env:
        STATUS: ${{ steps.score.outputs.status }}
