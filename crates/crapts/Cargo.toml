[package]
name = "crapts"
version = "0.1.0"
edition.workspace = true
rust-version = "1.98"
authors.workspace = true
license.workspace = true
description = "JavaScript and TypeScript source analysis for the CRAP metric"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/crapts"
keywords = ["javascript", "typescript", "coverage", "complexity", "metrics"]
categories = ["development-tools::testing"]
exclude = ["tests/*.rs", "tests/support/", "tests/fixtures/corpus/", "proptest-regressions/"]

[[bin]]
name = "crapts"
path = "src/main.rs"

[dependencies]
cargo-crap-core.workspace = true
clap.workspace = true
globset.workspace = true
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_ast_visit.workspace = true
oxc_parser.workspace = true
oxc_span.workspace = true
oxc_str.workspace = true
oxc_syntax = { workspace = true, features = ["to_js_string"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
toml = { workspace = true, features = ["parse"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[features]
triage = ["cargo-crap-core/triage"]

[dev-dependencies]
flate2 = { workspace = true, features = ["rust_backend"] }
jsonschema.workspace = true
unicode-width.workspace = true
proptest.workspace = true
regex-syntax.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/crapts-v{ version }/crapts-{ target }.tar.gz"
bin-dir = "crapts{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/crapts-v{ version }/crapts-{ target }.zip"
pkg-fmt = "zip"
