[package]
name = "cargo-crap-core"
version = "0.1.0"
edition.workspace = true
rust-version = "1.88"
authors.workspace = true
license.workspace = true
description = "Language-neutral CRAP scoring, coverage reading, delta and reports shared by cargo-crap and crapts"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/cargo-crap-core"
keywords = ["code-quality", "coverage", "complexity", "metrics"]
categories = ["development-tools::testing"]
exclude = [
    "tests/*",
    "!tests/fixtures/",
    "tests/fixtures/*",
    "!tests/fixtures/cargo_crap_tool.inc.rs",
    "!tests/fixtures/second_tool.inc.rs",
    "!tests/fixtures/lcov/",
    "tests/fixtures/lcov/*",
    "!tests/fixtures/lcov/p_bad_known.info",
    "proptest-regressions/",
]

[dependencies]
anyhow.workspace = true
comfy-table.workspace = true
globset.workspace = true
lcov.workspace = true
owo-colors.workspace = true
percent-encoding.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["float_roundtrip", "raw_value"] }
unicode-width.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
