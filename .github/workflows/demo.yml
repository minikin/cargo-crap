name: Demo

# The live version of the README hero: a pull request that changes
# examples/hero-shop gets the comment cargo-crap would post on that shop's
# own pull request, through this repository's GitHub Action (`uses: ./`).
# The CRAP delta compares the shop on the base branch with the shop in the
# pull request, and the duplicate section lists the look-alikes the pull
# request adds, triaged by OpenAI. Verdicts for the hero's pairs are
# committed under docs/assets/hero/triage-cache, so the demo needs no key.
# With an OPENAI_API_KEY secret, a pair missing from that cache is asked
# about; without one it shows untriaged.
#
# The showcase pull request is a draft from demo/hero-shop-pr that copies
# examples/hero-shop/pr/*.rs over src/. It is never merged.

on:
  pull_request:
    paths:
      - 'examples/hero-shop/**'
      - '.github/workflows/demo.yml'

permissions:
  contents: read
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  comment:
    name: Demo PR comment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/build"

      # The Action is tested with the code under review: this pull request's
      # cargo-crap, with triage built in.
      - name: Build cargo-crap
        run: cargo build --release --features triage --target-dir target/build

      # The verdicts for the hero's pairs are seeded into the shop's target
      # directory's triage cache, so the demo needs no key. Under the
      # runner's temp directory, which no cache restores, so only the
      # committed verdicts are there.
      - name: Seed the triage cache and the shop's config
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/demo-target" >> "$GITHUB_ENV"
          CARGO_TARGET_DIR="$RUNNER_TEMP/demo-target"
          mkdir -p "$CARGO_TARGET_DIR/cargo-crap/triage"
          cp docs/assets/hero/triage-cache/*.json "$CARGO_TARGET_DIR/cargo-crap/triage/"
          printf '[duplicates]\nenabled = true\n\n[duplicates.triage]\nenabled = true\nprovider = "openai"\n' \
            > examples/hero-shop/.cargo-crap.toml

      # The base-commit run reads the same config, records the shop's
      # duplicates and never asks the API. Its own marker keeps this comment
      # apart from the self-score one, and the showcase's regression is the
      # point, so it does not fail the job.
      - uses: ./
        with:
          binary: ${{ github.workspace }}/target/build/release/cargo-crap
          working-directory: examples/hero-shop
          args: --path src --threshold 15
          comment-marker: "<!-- cargo-crap-demo -->"
          fail-regression: false
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
