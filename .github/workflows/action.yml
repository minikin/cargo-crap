          REGRESSED: ${{ steps.crap.outputs.regressed }}
          SIGNALS: ${{ steps.crap.outputs.signal-regressions }}
        run: |
          test "$OUTCOME" = failure
          test "$REGRESSED" = 0
          test "$SIGNALS" = 2

  pr-keys:
    name: Provider keys reach no build script and no test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      - name: A pull request whose build script and test record what they see
        id: shop
        run: |
          scripts/action/fixture.sh "$RUNNER_TEMP/shop" key-probe
          echo "base=$(git -C "$RUNNER_TEMP/shop" rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
      - uses: ./
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          base: ${{ steps.shop.outputs.base }}
          comment: false
        env:
          KEY_PROBE: ${{ runner.temp }}/seen
          TYPESAFE_API_KEY: not-a-key
          OPENAI_API_KEY: not-a-key
      - name: No key on either commit
        run: |
          test "$(grep -c '^unset$' "$RUNNER_TEMP/seen")" -ge 4
          if grep -q '^set$' "$RUNNER_TEMP/seen"; then exit 1; fi

  pr-checkout-state:
    name: The base-commit run leaves the caller's checkout as it was
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      - name: A branch, a staged and an unstaged edit, an untracked file the base tracks, a sibling worktree
        id: shop
        run: |
          scripts/action/fixture.sh "$RUNNER_TEMP/shop" base-only
          cd "$RUNNER_TEMP/shop"
          echo "base=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
          git switch -q -c feature
          echo "// staged" >> src/lib.rs
          git add src/lib.rs
          echo "// unstaged" >> src/lib.rs
          echo local > src/old.rs
          git worktree add -q --detach "$RUNNER_TEMP/sibling" HEAD
      - uses: ./
        id: crap
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          base: ${{ steps.shop.outputs.base }}
          comment: false
      - name: Everything kept, and only the sibling worktree left
        run: |
          cd "$RUNNER_TEMP/shop"
          test "$(git symbolic-ref --short HEAD)" = feature
          git diff --cached | grep -q '^+// staged'
          test "$(tail -n 1 src/lib.rs)" = "// unstaged"
          test "$(cat src/old.rs)" = local
          test "$(git worktree list | wc -l)" = 2
          test -f "$RUNNER_TEMP/sibling/src/lib.rs"

  pr-submodule:
    name: A base commit whose submodules cannot be fetched fails the step
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      - name: A base commit with a submodule nobody can fetch
        id: shop
        run: |
          scripts/action/fixture.sh "$RUNNER_TEMP/shop" submodule
          echo "base=$(git -C "$RUNNER_TEMP/shop" rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
      - uses: ./
        id: crap
        continue-on-error: true
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          base: ${{ steps.shop.outputs.base }}
          comment: false
      - name: Failed, with no worktree left behind
        env:
          OUTCOME: ${{ steps.crap.outcome }}
        run: |
          test "$OUTCOME" = failure
          test "$(git -C "$RUNNER_TEMP/shop" worktree list | wc -l)" = 1

  args-owned:
    name: A flag the Action sets itself is refused in args
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      - name: A small tested crate
        run: scripts/action/fixture.sh "$RUNNER_TEMP/shop"
      - uses: ./
        id: crap
        continue-on-error: true
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          base: ""
          comment: false
          args: --format json
      - name: Failed before anything was scored
        env:
          OUTCOME: ${{ steps.crap.outcome }}
          REPORT: ${{ steps.crap.outputs.report }}
        run: |
          test "$OUTCOME" = failure
          test -z "$REPORT"

  links-with-spaces:
    name: Links reach a crate whose directory has a space
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      - name: A crate under "crates/my shop"
        run: scripts/action/fixture.sh "$RUNNER_TEMP/repo" "" "crates/my shop"
      - uses: ./
        id: crap
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/repo/crates/my shop
          base: ""
          comment: false
      - name: The link encodes the space
        env:
          REPORT: ${{ steps.crap.outputs.report }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: grep -q "/blob/${HEAD_SHA:-$GITHUB_SHA}/crates/my%20shop/" "$REPORT"

  platforms-candidate:
    name: The candidate compares a pull request on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p cargo-crap
      # A target directory of the job's own choosing, which the base run
      # must share, and a symlinked path to the crate on the runners that
      # have symlinks.
      - name: A pull request that only rewords a comment
        id: shop
        run: |
          scripts/action/fixture.sh "$RUNNER_TEMP/shop" steady
          echo "base=$(git -C "$RUNNER_TEMP/shop" rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
          dir="$RUNNER_TEMP/shop"
          if [ "$RUNNER_OS" != Windows ]; then
            ln -s "$RUNNER_TEMP/shop" "$RUNNER_TEMP/link"
            dir="$RUNNER_TEMP/link"
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - uses: ./
        id: crap
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
        with:
          binary: ${{ github.workspace }}/target/debug/cargo-crap${{ runner.os == 'Windows' && '.exe' || '' }}
          working-directory: ${{ steps.shop.outputs.dir }}
          base: ${{ steps.shop.outputs.base }}
          comment: false
      - name: Compared, in the job's target directory, back on the pull request
        env:
          REPORT: ${{ steps.crap.outputs.report }}
          REGRESSED: ${{ steps.crap.outputs.regressed }}
        run: |
          grep -q 'No CRAP regressions' "$REPORT"
          test "$REGRESSED" = 0
          test -d "$RUNNER_TEMP/target/llvm-cov-target"
          test ! -e "$RUNNER_TEMP/shop/target"
          test "$(git -C "$RUNNER_TEMP/shop" log -1 --format=%s)" = pr
          test "$(git -C "$RUNNER_TEMP/shop" worktree list | wc -l)" = 1

  mixed-comments:
    name: Both candidate Actions update their own comment
    if: github.repository == 'minikin/cargo-crap'
    runs-on: ubuntu-latest
    env:
      CARGO_CRAP_TEST_PR_NUMBER: '42'
      CRAPTS_TEST_PR_NUMBER: '42'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p cargo-crap -p crapts
      - name: Prepare mixed PR and local services
        shell: bash
        run: |
          dir="$RUNNER_TEMP/mixed"
          python3 scripts/action/crapts/tests/mixed.py setup "$dir/project"
          python3 scripts/action/stub.py 18442 "$dir/api.log" github > "$dir/stub.log" 2>&1 &
          echo 'CARGO_CRAP_TEST_API_URL=http://127.0.0.1:18442' >> "$GITHUB_ENV"
          echo 'CRAPTS_TEST_API_URL=http://127.0.0.1:18442' >> "$GITHUB_ENV"
          bash scripts/action/crapts/registry.sh "$dir"
      - uses: ./
        with:
          working-directory: ${{ runner.temp }}/mixed/project/rust
          binary: ${{ github.workspace }}/target/debug/cargo-crap
          args: --threshold 0
          lcov: hits.info
          base: ''
          github-token: fixture-token
      - uses: ./actions/crapts
        with:
          working-directory: ${{ runner.temp }}/mixed/project/ts
          package: ${{ runner.temp }}/mixed/candidate wrapper.tgz
          args: --threshold 0
          coverage: hits.info
          base: ''
          github-token: fixture-token
      - run: python3 scripts/action/crapts/tests/mixed.py update "$RUNNER_TEMP/mixed/project" "$CRAPTS_TEST_API_URL"
      - uses: ./
        with:
          working-directory: ${{ runner.temp }}/mixed/project/rust
          binary: ${{ github.workspace }}/target/debug/cargo-crap
          args: --threshold 0
          lcov: hits.info
          base: ''
          github-token: fixture-token
      - uses: ./actions/crapts
        with:
          working-directory: ${{ runner.temp }}/mixed/project/ts
          package: ${{ runner.temp }}/mixed/candidate wrapper.tgz
          args: --threshold 0
          coverage: hits.info
          base: ''
          github-token: fixture-token
      - run: python3 scripts/action/crapts/tests/mixed.py check "$RUNNER_TEMP/mixed/project" "$CRAPTS_TEST_API_URL"

  crapts-candidate:
    name: Candidate crapts Action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p crapts
      - run: bash scripts/action/crapts/test.sh
      - run: bash scripts/action/crapts/registry.sh "$RUNNER_TEMP/crapts-smoke"
      - name: Prepare push and shallow PR
        id: fixture
        run: python scripts/action/crapts/tests/smoke.py setup "$RUNNER_TEMP/crapts-smoke"
      - uses: ./actions/crapts
        id: push-score
        if: github.event_name == 'push'
        with:
          working-directory: ${{ runner.temp }}/crapts-smoke/push
          package: ${{ runner.temp }}/crapts-smoke/candidate wrapper.tgz
          base: ''
          coverage: hits.info
          comment: 'false'
          github-token: fixture-token
      - name: Check push report and launcher
        if: github.event_name == 'push'
        env:
          CRAPPY: ${{ steps.push-score.outputs.crappy }}
          REGRESSED: ${{ steps.push-score.outputs.regressed }}
          CHANGED: ${{ steps.push-score.outputs.changed }}
          REPORT: ${{ steps.push-score.outputs.report }}
          OUTCOME: ${{ steps.push-score.outcome }}
        run: LAUNCHER_VERSION="$(crapts --version)" python scripts/action/crapts/tests/smoke.py push "$RUNNER_TEMP/crapts-smoke"
      - uses: ./actions/crapts
        id: pr-score
        continue-on-error: true
        env:
          TRACE: ${{ runner.temp }}/crapts-smoke/trace
          CRAPTS_TEST_PR_NUMBER: '42'
        with:
          working-directory: ${{ runner.temp }}/crapts-smoke/checkout/packages/shop
          package: ${{ runner.temp }}/crapts-smoke/candidate wrapper.tgz
          base: ${{ steps.fixture.outputs.base }}
          install-command: bash "scripts with spaces/install deps.sh"
          coverage-command: bash "scripts with spaces/run coverage.sh"
          coverage-file: coverage.info
          comment: 'false'
          github-token: fixture-token
      - name: Check PR gate and restored checkout
        env:
          CRAPPY: ${{ steps.pr-score.outputs.crappy }}
          REGRESSED: ${{ steps.pr-score.outputs.regressed }}
          CHANGED: ${{ steps.pr-score.outputs.changed }}
          REPORT: ${{ steps.pr-score.outputs.report }}
          OUTCOME: ${{ steps.pr-score.outcome }}
        run: python scripts/action/crapts/tests/smoke.py pr "$RUNNER_TEMP/crapts-smoke"
