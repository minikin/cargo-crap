          REGRESSED: ${{ steps.crap.outputs.regressed }}
          REPORT: ${{ steps.crap.outputs.report }}
          OLD: ${{ steps.old.outcome }}
          OLD_REPORT: ${{ steps.old.outputs.report }}
        run: |
          test "$OUTCOME" = failure
          test "$REGRESSED" = 1
          grep -q '"shipping"' "$(dirname "$REPORT")/base.json"
          test "$OLD" = failure
