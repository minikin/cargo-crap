name: Action

# The acceptance tests of spec 39: one job per scenario of the composite
# action at the repository root, each run through `uses: ./` against a
# fixture crate built in the runner's temp directory. Jobs that are not about
# installing a release pass `binary` with a cargo-crap built from this
# commit, so the Action is tested with the code under review. No job reads
# untrusted event text: outputs reach `run:` through `env:`.

on:
  pull_request:
    paths:
      - 'action.yml'
      - 'scripts/action/**'
      - '.github/workflows/action.yml'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  push:
    branches: [main]
    paths:
      - 'action.yml'
      - 'scripts/action/**'
      - '.github/workflows/action.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  scripts:
    name: Action scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Shell tests
        run: bash scripts/action/test.sh
      - name: Shellcheck
        run: shellcheck -x scripts/action/*.sh
      # Catches what a run cannot: a context used where it is not allowed
      # rejects the whole workflow, and a bare `! grep` never fails a step.
      - name: Actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -ignore SC2016 .github/workflows/action.yml .github/workflows/demo.yml .github/workflows/release.yml

  build:
    name: Build cargo-crap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --features triage
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-crap-under-test
          path: target/release/cargo-crap
          retention-days: 1

  push-report:
    name: A push run writes the report to the job summary
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      - name: A small tested crate
        run: |
          chmod +x "$RUNNER_TEMP/bin/cargo-crap"
          scripts/action/fixture.sh "$RUNNER_TEMP/shop"
      - uses: ./
        id: crap
        with:
          # A push run: the workflow's own pull request is not this one.
          base: ""
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
      - name: The report, the summary and the outputs
        env:
          CRAPPY: ${{ steps.crap.outputs.crappy }}
          REPORT: ${{ steps.crap.outputs.report }}
        run: |
          test "$CRAPPY" = 0
          grep -q '`shipping`' "$REPORT"
          grep -q 'none exceed CRAP threshold' "$REPORT"
          # The step's job summary, copied beside the report.
          grep -q '`shipping`' "$(dirname "$REPORT")/summary.md"

  version:
    name: A chosen cargo-crap version is installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: A small tested crate
        run: scripts/action/fixture.sh "$RUNNER_TEMP/shop"
      - uses: ./
        with:
          # A push run: the workflow's own pull request is not this one.
          base: ""
          # Not the default, so the input is what picks it.
          version: 0.6.1
          working-directory: ${{ runner.temp }}/shop
      - name: That release is on the path
        run: test "$(cargo-crap --version)" = "cargo-crap 0.6.1"

  binary:
    name: A given binary is used instead of a download
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      # No chmod: the artifact arrives without its execute bit, and the
      # Action restores it.
      - name: A small tested crate
        run: scripts/action/fixture.sh "$RUNNER_TEMP/shop"
      - uses: ./
        with:
          # A push run: the workflow's own pull request is not this one.
          base: ""
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
      - name: Nothing was downloaded, and the built binary scored
        run: |
          test ! -e "$RUNNER_TEMP/cargo-crap-bin"
          test "$(command -v cargo-crap)" = "$RUNNER_TEMP/bin/cargo-crap"

  fail-above:
    name: The fail-above gate fails the step after the outputs are set
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      - name: A small tested crate
        run: scripts/action/fixture.sh "$RUNNER_TEMP/shop"
      - uses: ./
        id: crap
        continue-on-error: true
        with:
          # A push run: the workflow's own pull request is not this one.
          base: ""
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          args: --threshold 2
          fail-above: true
      - name: The step failed, and still counted
        env:
          OUTCOME: ${{ steps.crap.outcome }}
          CRAPPY: ${{ steps.crap.outputs.crappy }}
        run: |
          test "$OUTCOME" = failure
          test "$CRAPPY" = 1

  pr-regression:
    name: A pull request is compared with its base commit
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      - name: A pull request that raises one function's score
        id: shop
        run: |
          scripts/action/fixture.sh "$RUNNER_TEMP/shop" regress
          echo "base=$(git -C "$RUNNER_TEMP/shop" rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
      - uses: ./
        id: crap
        continue-on-error: true
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          base: ${{ steps.shop.outputs.base }}
          comment: false
      - name: The regression is reported, counted and fails the step
        env:
          OUTCOME: ${{ steps.crap.outcome }}
          REGRESSED: ${{ steps.crap.outputs.regressed }}
          REPORT: ${{ steps.crap.outputs.report }}
        run: |
          test "$OUTCOME" = failure
          test "$REGRESSED" = 1
          grep -q '1 CRAP regression' "$REPORT"
          test "$(git -C "$RUNNER_TEMP/shop" log -1 --format=%s)" = pr

  pr-steady:
    name: A pull request without regressions passes
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      - name: A pull request that only rewords a comment, and a local edit
        id: shop
        run: |
          scripts/action/fixture.sh "$RUNNER_TEMP/shop" steady
          echo "base=$(git -C "$RUNNER_TEMP/shop" rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
          echo "// generated by the job" >> "$RUNNER_TEMP/shop/src/lib.rs"
      - uses: ./
        id: crap
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          base: ${{ steps.shop.outputs.base }}
          comment: false
      - name: No regression is reported, and the local edit survived
        env:
          REGRESSED: ${{ steps.crap.outputs.regressed }}
          REPORT: ${{ steps.crap.outputs.report }}
        run: |
          test "$REGRESSED" = 0
          grep -q 'No CRAP regressions' "$REPORT"
          tail -n 1 "$RUNNER_TEMP/shop/src/lib.rs" | grep -q 'generated by the job'

  pr-broken-base:
    name: A base commit that fails leaves the pull request checked out
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      - name: A base commit that does not compile
        id: shop
        run: |
          scripts/action/fixture.sh "$RUNNER_TEMP/shop" broken-base
          echo "base=$(git -C "$RUNNER_TEMP/shop" rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
      - uses: ./
        id: crap
        continue-on-error: true
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          base: ${{ steps.shop.outputs.base }}
          comment: false
      - name: The step failed, on the pull request's commit, with a clean tree
        env:
          OUTCOME: ${{ steps.crap.outcome }}
        run: |
          test "$OUTCOME" = failure
          test "$(git -C "$RUNNER_TEMP/shop" log -1 --format=%s)" = pr
          test -z "$(git -C "$RUNNER_TEMP/shop" status --porcelain --untracked-files=no)"

  given-lcov:
    name: An existing LCOV file skips the coverage run
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      - name: A pull request, a baseline of its base commit, and an LCOV file
        run: |
          chmod +x "$RUNNER_TEMP/bin/cargo-crap"
          scripts/action/fixture.sh "$RUNNER_TEMP/shop" regress
          cd "$RUNNER_TEMP/shop"
          git checkout -q HEAD~1
          "$RUNNER_TEMP/bin/cargo-crap" --path . --format json --output base.json
          git checkout -q -
          # Every line of `shipping` covered: a run of its own tests would not.
          { echo "SF:src/lib.rs"; for l in $(seq 2 14); do echo "DA:$l,1"; done; echo end_of_record; } > lcov.info
      - uses: ./
        id: crap
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          lcov: lcov.info
          baseline: base.json
          comment: false
      - name: No tests ran, and the given coverage and baseline were used
        env:
          REPORT: ${{ steps.crap.outputs.report }}
        run: |
          # Not installed, and no coverage file of the Action's own.
          if command -v cargo-llvm-cov; then exit 1; fi
          test ! -e "$(dirname "$REPORT")/lcov.info"
          grep -q '| 100.0 |' "$REPORT"
          # Compared with the file: no base-commit run left its record.
          test ! -e "$(dirname "$REPORT")/base.json"
          grep -q '↑ 0 regressed' "$REPORT"

  given-baseline:
    name: A given baseline file replaces the base-commit run
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      - name: A pull request and a baseline recorded without coverage
        run: |
          chmod +x "$RUNNER_TEMP/bin/cargo-crap"
          scripts/action/fixture.sh "$RUNNER_TEMP/shop" steady
          cd "$RUNNER_TEMP/shop"
          git checkout -q HEAD~1
          "$RUNNER_TEMP/bin/cargo-crap" --path . --format json --output base.json
          git checkout -q -
      - uses: ./
        id: crap
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          baseline: base.json
          comment: false
          # No such commit, and never looked up: the baseline replaces it.
          base: "0000000000000000000000000000000000000000"
      - name: Compared with the file, not with a run of the base commit
        env:
          REPORT: ${{ steps.crap.outputs.report }}
        run: |
          # Without coverage the file scored `shipping` higher, so it improved.
          # A base-commit run with coverage would leave it unchanged.
          grep -q '↓ 1 improved' "$REPORT"
          test ! -e "$(dirname "$REPORT")/base.json"

  pr-unknown-base:
    name: A base commit that cannot be found fails the step
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      - name: A pull request
        run: scripts/action/fixture.sh "$RUNNER_TEMP/shop" steady
      - uses: ./
        id: crap
        continue-on-error: true
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          base: "1234567890123456789012345678901234567890"
          comment: false
      - name: Failed, rather than compared with the pull request itself
        env:
          OUTCOME: ${{ steps.crap.outcome }}
          REPORT: ${{ steps.crap.outputs.report }}
        run: |
          test "$OUTCOME" = failure
          test -z "$REPORT"

  given-lcov-alone:
    name: An LCOV file without a baseline cannot gate a pull request
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      - name: A pull request and an LCOV file
        id: shop
        run: |
          scripts/action/fixture.sh "$RUNNER_TEMP/shop" steady
          echo "base=$(git -C "$RUNNER_TEMP/shop" rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
          { echo "SF:src/lib.rs"; echo "DA:2,1"; echo end_of_record; } > "$RUNNER_TEMP/shop/lcov.info"
      - uses: ./
        id: gated
        continue-on-error: true
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          base: ${{ steps.shop.outputs.base }}
          comment: false
          lcov: lcov.info
      - uses: ./
        id: ungated
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          base: ${{ steps.shop.outputs.base }}
          comment: false
          lcov: lcov.info
          fail-regression: false
      - name: Refused under the gate, reported without it
        env:
          GATED: ${{ steps.gated.outcome }}
          REPORT: ${{ steps.ungated.outputs.report }}
        run: |
          test "$GATED" = failure
          grep -q '`shipping`' "$REPORT"

  pr-config:
    name: The base-commit run uses the pull request's config
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      - name: A base commit whose config excludes the crate
        id: shop
        run: |
          scripts/action/fixture.sh "$RUNNER_TEMP/shop" config-skew
          echo "base=$(git -C "$RUNNER_TEMP/shop" rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
      - uses: ./
        id: crap
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          base: ${{ steps.shop.outputs.base }}
          comment: false
      - name: Under the base commit's own config every function would be new
        env:
          REPORT: ${{ steps.crap.outputs.report }}
        run: grep -q '★ 0 new' "$REPORT"

  pr-triage:
    name: The base-commit run never pays for triage
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      - name: A pair only the base holds, a new pair in the pull request, triage on
        id: shop
        run: |
          scripts/action/fixture.sh "$RUNNER_TEMP/shop" lone-copy
          printf '[duplicates]\nenabled = true\n\n[duplicates.triage]\nenabled = true\n' \
            > "$RUNNER_TEMP/shop/.cargo-crap.toml"
          echo "base=$(git -C "$RUNNER_TEMP/shop" rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
          python3 scripts/action/stub.py 8765 "$RUNNER_TEMP/api.log" triage &
          sleep 1
      - uses: ./
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          base: ${{ steps.shop.outputs.base }}
          comment: false
        env:
          TYPESAFE_API_KEY: not-a-key
          TYPESAFE_BASE_URL: http://127.0.0.1:8765
      - name: Only the pull request's new pair was asked about
        run: |
          grep -q 'keep_a' "$RUNNER_TEMP/api.log"
          if grep -q 'fn two' "$RUNNER_TEMP/api.log"; then exit 1; fi
          if grep -q '"triage"' "$RUNNER_TEMP"/cargo-crap.*/base.json; then exit 1; fi

  pr-budget:
    name: The triage budget is spent once per job
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      - name: Five new groups, none cached, and a budget of two
        id: shop
        run: |
          scripts/action/fixture.sh "$RUNNER_TEMP/shop" five-groups
          printf '[duplicates]\nenabled = true\n\n[duplicates.triage]\nenabled = true\nmax-requests = 2\n' \
            > "$RUNNER_TEMP/shop/.cargo-crap.toml"
          echo "base=$(git -C "$RUNNER_TEMP/shop" rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
          python3 scripts/action/stub.py 8765 "$RUNNER_TEMP/api.log" verdicts &
          sleep 1
      - uses: ./
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          base: ${{ steps.shop.outputs.base }}
          comment: false
        env:
          TYPESAFE_API_KEY: not-a-key
          TYPESAFE_BASE_URL: http://127.0.0.1:8765
      # Five groups, so a second paid run would have three more to ask.
      - name: Two requests in the whole job, over five groups
        run: |
          test "$(grep -c '/v1/systemone' "$RUNNER_TEMP/api.log")" = 2
          groups="$("$RUNNER_TEMP/bin/cargo-crap" --path "$RUNNER_TEMP/shop" --duplicates --format json 2> /dev/null \
            | python3 -c 'import json, sys; print(len(json.load(sys.stdin)["duplicate_groups"]))')"
          test "$groups" = 5

  bad-args:
    name: Arguments that cannot be split fail the step
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      - name: A small tested crate
        run: scripts/action/fixture.sh "$RUNNER_TEMP/shop"
      - uses: ./
        id: crap
        continue-on-error: true
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          base: ""
          args: --threshold 20'
      # The split is the first thing the score step writes to its directory:
      # an empty words file and nothing else means it stopped there.
      - name: Failed at the split, before anything was scored
        env:
          OUTCOME: ${{ steps.crap.outcome }}
          REPORT: ${{ steps.crap.outputs.report }}
        run: |
          test "$OUTCOME" = failure
          test -z "$REPORT"
          work=("$RUNNER_TEMP"/cargo-crap.*)
          test "${#work[@]}" = 1
          test "$(ls -A "${work[0]}")" = args.words
          test ! -s "${work[0]}/args.words"

  pr-args:
    name: Extra arguments reach cargo-crap
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      - name: A file both commits hold
        id: shop
        run: |
          scripts/action/fixture.sh "$RUNNER_TEMP/shop" extra
          echo "base=$(git -C "$RUNNER_TEMP/shop" rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
      - uses: ./
        id: crap
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          base: ${{ steps.shop.outputs.base }}
          comment: false
          args: --exclude 'src/extra.rs'
      # The comparison would hide a base run that ignored them: the loaded
      # baseline is filtered with the pull request's excludes anyway. So the
      # base run's own record is what is read.
      - name: The base run excluded the file too
        env:
          REPORT: ${{ steps.crap.outputs.report }}
        run: |
          base="$(dirname "$REPORT")/base.json"
          grep -q '"shipping"' "$base"
          if grep -q 'extra_one' "$base"; then exit 1; fi

  comment-update:
    name: A second run updates the comment instead of adding one
    needs: build
    runs-on: ubuntu-latest
    env:
      CARGO_CRAP_TEST_API_URL: http://127.0.0.1:8765
      CARGO_CRAP_TEST_PR_NUMBER: "42"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      - name: A regression, and an API holding the comment of an earlier run
        run: |
          scripts/action/fixture.sh "$RUNNER_TEMP/shop" regress
          scripts/action/prepared.sh "$RUNNER_TEMP/shop" "$RUNNER_TEMP/bin/cargo-crap"
          python3 scripts/action/stub.py 8765 "$RUNNER_TEMP/api.log" github \
            --existing $'<!-- cargo-crap-report -->\nan earlier report' &
          sleep 1
      - uses: ./
        id: crap
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          lcov: lcov.info
          baseline: base.json
          fail-regression: false
      - name: The earlier comment was updated, and none was added
        env:
          REPORT: ${{ steps.crap.outputs.report }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          grep -q '"method": "PATCH", "path": "/repos/[^/]*/[^/]*/issues/comments/7"' "$RUNNER_TEMP/api.log"
          if grep -q '"method": "POST"' "$RUNNER_TEMP/api.log"; then exit 1; fi
          # The links name the pull request's head, or the pushed commit.
          grep -q "/blob/${HEAD_SHA:-$GITHUB_SHA}/" "$REPORT"

  comment-fork:
    name: A fork's pull request gets the report in the job summary
    needs: build
    runs-on: ubuntu-latest
    env:
      CARGO_CRAP_TEST_API_URL: http://127.0.0.1:8765
      CARGO_CRAP_TEST_PR_NUMBER: "42"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      - name: A regression, and an API that refuses every write
        run: |
          scripts/action/fixture.sh "$RUNNER_TEMP/shop" regress
          scripts/action/prepared.sh "$RUNNER_TEMP/shop" "$RUNNER_TEMP/bin/cargo-crap"
          python3 scripts/action/stub.py 8765 "$RUNNER_TEMP/api.log" github --forbid &
          sleep 1
      - uses: ./
        id: gated
        continue-on-error: true
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          lcov: lcov.info
          baseline: base.json
      # Without the gate, a refused comment alone must not fail the step:
      # it warns, it does not crash.
      - uses: ./
        id: ungated
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          lcov: lcov.info
          baseline: base.json
          fail-regression: false
      - name: Refused, summarised, and still gated
        env:
          GATED: ${{ steps.gated.outcome }}
          REPORT: ${{ steps.gated.outputs.report }}
        run: |
          grep -q '"method": "POST"' "$RUNNER_TEMP/api.log"
          grep -q '1 CRAP regression' "$(dirname "$REPORT")/summary.md"
          test "$GATED" = failure

  comment-markers:
    name: Two comments with their own markers stay apart
    needs: build
    runs-on: ubuntu-latest
    env:
      CARGO_CRAP_TEST_API_URL: http://127.0.0.1:8765
      CARGO_CRAP_TEST_PR_NUMBER: "42"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      - name: A pull request, and a stand-in GitHub API
        run: |
          scripts/action/fixture.sh "$RUNNER_TEMP/shop" steady
          scripts/action/prepared.sh "$RUNNER_TEMP/shop" "$RUNNER_TEMP/bin/cargo-crap"
          python3 scripts/action/stub.py 8765 "$RUNNER_TEMP/api.log" github &
          sleep 1
      - uses: ./
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          lcov: lcov.info
          baseline: base.json
      - uses: ./
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          lcov: lcov.info
          baseline: base.json
          comment-marker: "<!-- cargo-crap-report-demo -->"
      - uses: ./
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          lcov: lcov.info
          baseline: base.json
      - uses: ./
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          lcov: lcov.info
          baseline: base.json
          comment-marker: "<!-- cargo-crap-report-demo -->"
      - name: Two comments, each updated by its own step
        run: |
          python3 - "$RUNNER_TEMP/api.log" <<'PY'
          import json, sys
          log = [json.loads(line) for line in open(sys.argv[1])]
          posts = [json.loads(r["body"])["body"] for r in log if r["method"] == "POST"]
          patches = [(r["path"].rsplit("/", 1)[1], json.loads(r["body"])["body"]) for r in log if r["method"] == "PATCH"]
          first = [p.splitlines()[0] for p in posts]
          assert first == ["<!-- cargo-crap-report -->", "<!-- cargo-crap-report-demo -->"], first
          updated = [(i, b.splitlines()[0]) for i, b in patches]
          assert updated == [("100", "<!-- cargo-crap-report -->"), ("101", "<!-- cargo-crap-report-demo -->")], updated
          PY

  comment-empty-marker:
    name: An empty comment marker is refused
    needs: build
    runs-on: ubuntu-latest
    env:
      CARGO_CRAP_TEST_API_URL: http://127.0.0.1:8765
      CARGO_CRAP_TEST_PR_NUMBER: "42"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      - name: A pull request, and someone else's comment on it
        run: |
          scripts/action/fixture.sh "$RUNNER_TEMP/shop" steady
          scripts/action/prepared.sh "$RUNNER_TEMP/shop" "$RUNNER_TEMP/bin/cargo-crap"
          python3 scripts/action/stub.py 8765 "$RUNNER_TEMP/api.log" github \
            --existing 'Looks good to me' &
          sleep 1
      - uses: ./
        id: crap
        continue-on-error: true
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          lcov: lcov.info
          baseline: base.json
          comment-marker: ""
      - name: Refused, and the other comment untouched
        env:
          OUTCOME: ${{ steps.crap.outcome }}
        run: |
          test "$OUTCOME" = failure
          if grep -q '"method": "PATCH"' "$RUNNER_TEMP/api.log"; then exit 1; fi

  links-in-subdirectory:
    name: Links reach a crate in a subdirectory
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      - name: A regression in a crate under crates/shop
        run: |
          scripts/action/fixture.sh "$RUNNER_TEMP/repo" regress crates/shop
          scripts/action/prepared.sh "$RUNNER_TEMP/repo/crates/shop" "$RUNNER_TEMP/bin/cargo-crap"
      - uses: ./
        id: crap
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/repo/crates/shop
          lcov: lcov.info
          baseline: base.json
          fail-regression: false
          comment: false
      - name: The links carry the subdirectory
        env:
          REPORT: ${{ steps.crap.outputs.report }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: grep -q "/blob/${HEAD_SHA:-$GITHUB_SHA}/crates/shop/" "$REPORT"

  own-checkout:
    name: The Action survives running inside the checkout it compares
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      # The demo's case: `uses: ./` from the repository being compared, whose
      # base commit does not hold the Action's scripts at all.
      - name: A pull request that also adds the Action itself
        id: shop
        run: |
          scripts/action/fixture.sh "$GITHUB_WORKSPACE/selftest" steady
          mkdir -p selftest/scripts
          cp action.yml selftest/
          cp -R scripts/action selftest/scripts/
          git -C selftest add -A
          git -C selftest -c user.name=fixture -c user.email=fixture@example.com commit -q --amend --no-edit
          echo "base=$(git -C selftest rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
      - uses: ./selftest
        id: crap
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: selftest
          base: ${{ steps.shop.outputs.base }}
          comment: false
      - name: Compared, and back on the pull request's commit
        env:
          REPORT: ${{ steps.crap.outputs.report }}
        run: |
          grep -q 'No CRAP regressions' "$REPORT"
          test -f selftest/scripts/action/score.sh

  platforms:
    name: It runs on Linux, macOS and Windows runners (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      # A pull request, so the base-commit run is exercised on every platform.
      - name: A pull request that only rewords a comment
        id: shop
        shell: bash
        run: |
          scripts/action/fixture.sh "$RUNNER_TEMP/shop" steady
          echo "base=$(git -C "$RUNNER_TEMP/shop" rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
      - uses: ./
        id: crap
        with:
          # The newest release that exists: the default names this commit's
          # version, released only after it lands. The release workflow runs
          # the Action with the default on every platform before moving v1.
          version: latest
          base: ${{ steps.shop.outputs.base }}
          comment: false
          working-directory: ${{ runner.temp }}/shop
      - name: The comparison was written, back on the pull request's commit
        shell: bash
        env:
          REPORT: ${{ steps.crap.outputs.report }}
        run: |
          grep -q 'No CRAP regressions' "$REPORT"
          test "$(git -C "$RUNNER_TEMP/shop" log -1 --format=%s)" = pr
