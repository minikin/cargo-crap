      CARGO_CRAP_TEST_API_URL: http://127.0.0.1:8765
      CARGO_CRAP_TEST_PR_NUMBER: "42"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      - name: An API that refuses every body over ten characters
        run: |
          scripts/action/fixture.sh "$RUNNER_TEMP/shop" steady
          scripts/action/prepared.sh "$RUNNER_TEMP/shop" "$RUNNER_TEMP/bin/cargo-crap"
          python3 scripts/action/stub.py 8765 "$RUNNER_TEMP/api.log" github --reject-over 10 &
          sleep 1
      - uses: ./
        id: crap
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          lcov: lcov.info
          baseline: base.json
          github-token: fixture-token
      - name: Passed, after the write was tried
        env:
          OUTCOME: ${{ steps.crap.outcome }}
        run: |
          test "$OUTCOME" = success
          grep -q '"method": "POST", "path": "/repos/' "$RUNNER_TEMP/api.log"

  comment-marker-lines:
    name: A marker of more than one line, or with spaces around it, is refused
    needs: build
    runs-on: ubuntu-latest
    env:
      CARGO_CRAP_TEST_API_URL: http://127.0.0.1:8765
      CARGO_CRAP_TEST_PR_NUMBER: "42"
