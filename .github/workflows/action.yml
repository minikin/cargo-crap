name: Action

# The acceptance tests of spec 39: one job per scenario of the composite
# action at the repository root, each run through `uses: ./` against a
# fixture crate built in the runner's temp directory. Jobs that are not about
# installing a release pass `binary` with a cargo-crap built from this
# commit, so the Action is tested with the code under review. No job reads
# untrusted event text: outputs reach `run:` through `env:`.

on:
  pull_request:
    paths:
      - 'action.yml'
      - 'scripts/action/**'
      - '.github/workflows/action.yml'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  push:
    branches: [main]
    paths:
      - 'action.yml'
      - 'scripts/action/**'
      - '.github/workflows/action.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  scripts:
    name: Action scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell tests
        run: bash scripts/action/test.sh
      - name: Shellcheck
        run: shellcheck -x scripts/action/*.sh

  build:
    name: Build cargo-crap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --features triage
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-crap-under-test
          path: target/release/cargo-crap
          retention-days: 1

  push-report:
    name: A push run writes the report to the job summary
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      - name: A small tested crate
        run: |
          chmod +x "$RUNNER_TEMP/bin/cargo-crap"
          scripts/action/fixture.sh "$RUNNER_TEMP/shop"
      - uses: ./
        id: crap
        with:
          # A push run: the workflow's own pull request is not this one.
          base: ""
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
      - name: The report, the summary and the outputs
        env:
          CRAPPY: ${{ steps.crap.outputs.crappy }}
          REPORT: ${{ steps.crap.outputs.report }}
        run: |
          test "$CRAPPY" = 0
          grep -q '`shipping`' "$REPORT"
          grep -q 'none exceed CRAP threshold' "$REPORT"
          # The step's job summary, copied beside the report.
          grep -q '`shipping`' "$(dirname "$REPORT")/summary.md"

  version:
    name: A chosen cargo-crap version is installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: A small tested crate
        run: scripts/action/fixture.sh "$RUNNER_TEMP/shop"
      - uses: ./
        with:
          # A push run: the workflow's own pull request is not this one.
          base: ""
          # Not the default, so the input is what picks it.
          version: 0.6.1
          working-directory: ${{ runner.temp }}/shop
      - name: That release is on the path
        run: test "$(cargo-crap --version)" = "cargo-crap 0.6.1"

  binary:
    name: A given binary is used instead of a download
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      # No chmod: the artifact arrives without its execute bit, and the
      # Action restores it.
      - name: A small tested crate
        run: scripts/action/fixture.sh "$RUNNER_TEMP/shop"
      - uses: ./
        with:
          # A push run: the workflow's own pull request is not this one.
          base: ""
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
      - name: Nothing was downloaded, and the built binary scored
        run: |
          test ! -e "$RUNNER_TEMP/cargo-crap-bin"
          test "$(command -v cargo-crap)" = "$RUNNER_TEMP/bin/cargo-crap"

  fail-above:
    name: The fail-above gate fails the step after the outputs are set
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      - name: A small tested crate
        run: scripts/action/fixture.sh "$RUNNER_TEMP/shop"
      - uses: ./
        id: crap
        continue-on-error: true
        with:
          # A push run: the workflow's own pull request is not this one.
          base: ""
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          args: --threshold 2
          fail-above: true
      - name: The step failed, and still counted
        env:
          OUTCOME: ${{ steps.crap.outcome }}
          CRAPPY: ${{ steps.crap.outputs.crappy }}
        run: |
          test "$OUTCOME" = failure
          test "$CRAPPY" = 1

  pr-regression:
    name: A pull request is compared with its base commit
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      - name: A pull request that raises one function's score
        id: shop
        run: |
          scripts/action/fixture.sh "$RUNNER_TEMP/shop" regress
          echo "base=$(git -C "$RUNNER_TEMP/shop" rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
      - uses: ./
        id: crap
        continue-on-error: true
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          base: ${{ steps.shop.outputs.base }}
      - name: The regression is reported, counted and fails the step
        env:
          OUTCOME: ${{ steps.crap.outcome }}
          REGRESSED: ${{ steps.crap.outputs.regressed }}
          REPORT: ${{ steps.crap.outputs.report }}
        run: |
          test "$OUTCOME" = failure
          test "$REGRESSED" = 1
          grep -q '1 CRAP regression' "$REPORT"
          test "$(git -C "$RUNNER_TEMP/shop" log -1 --format=%s)" = pr

  pr-steady:
    name: A pull request without regressions passes
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      - name: A pull request that only rewords a comment, and a local edit
        id: shop
        run: |
          scripts/action/fixture.sh "$RUNNER_TEMP/shop" steady
          echo "base=$(git -C "$RUNNER_TEMP/shop" rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
          echo "// generated by the job" >> "$RUNNER_TEMP/shop/src/lib.rs"
      - uses: ./
        id: crap
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          base: ${{ steps.shop.outputs.base }}
      - name: No regression is reported, and the local edit survived
        env:
          REGRESSED: ${{ steps.crap.outputs.regressed }}
          REPORT: ${{ steps.crap.outputs.report }}
        run: |
          test "$REGRESSED" = 0
          grep -q 'No CRAP regressions' "$REPORT"
          tail -n 1 "$RUNNER_TEMP/shop/src/lib.rs" | grep -q 'generated by the job'

  pr-broken-base:
    name: A base commit that fails leaves the pull request checked out
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      - name: A base commit that does not compile
        id: shop
        run: |
          scripts/action/fixture.sh "$RUNNER_TEMP/shop" broken-base
          echo "base=$(git -C "$RUNNER_TEMP/shop" rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
      - uses: ./
        id: crap
        continue-on-error: true
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          base: ${{ steps.shop.outputs.base }}
      - name: The step failed, on the pull request's commit, with a clean tree
        env:
          OUTCOME: ${{ steps.crap.outcome }}
        run: |
          test "$OUTCOME" = failure
          test "$(git -C "$RUNNER_TEMP/shop" log -1 --format=%s)" = pr
          test -z "$(git -C "$RUNNER_TEMP/shop" status --porcelain --untracked-files=no)"

  given-lcov:
    name: An existing LCOV file skips the coverage run
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      - name: A pull request, a baseline of its base commit, and an LCOV file
        run: |
          chmod +x "$RUNNER_TEMP/bin/cargo-crap"
          scripts/action/fixture.sh "$RUNNER_TEMP/shop" regress
          cd "$RUNNER_TEMP/shop"
          git checkout -q HEAD~1
          "$RUNNER_TEMP/bin/cargo-crap" --path . --format json --output base.json
          git checkout -q -
          # Every line of `shipping` covered: a run of its own tests would not.
          { echo "SF:src/lib.rs"; for l in $(seq 2 14); do echo "DA:$l,1"; done; echo end_of_record; } > lcov.info
      - uses: ./
        id: crap
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          lcov: lcov.info
          baseline: base.json
      - name: No tests ran, and the given coverage and baseline were used
        env:
          REPORT: ${{ steps.crap.outputs.report }}
        run: |
          ! command -v cargo-llvm-cov
          test ! -d "$RUNNER_TEMP/shop/target/debug"
          grep -q '| 100.0 |' "$REPORT"
          grep -q 'regressed ·' "$REPORT"

  given-baseline:
    name: A given baseline file replaces the base-commit run
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      - name: A pull request and a baseline recorded without coverage
        run: |
          chmod +x "$RUNNER_TEMP/bin/cargo-crap"
          scripts/action/fixture.sh "$RUNNER_TEMP/shop" steady
          cd "$RUNNER_TEMP/shop"
          git checkout -q HEAD~1
          "$RUNNER_TEMP/bin/cargo-crap" --path . --format json --output base.json
          git checkout -q -
      - uses: ./
        id: crap
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          baseline: base.json
          # No such commit: a base-commit run would fail on it.
          base: "0000000000000000000000000000000000000000"
      - name: Compared with the file, not with a run of the base commit
        env:
          REPORT: ${{ steps.crap.outputs.report }}
        run: |
          # Without coverage the file scored `shipping` higher, so it improved.
          # A base-commit run with coverage would leave it unchanged.
          grep -q '↓ 1 improved' "$REPORT"
          test "$(git -C "$RUNNER_TEMP/shop" log -1 --format=%s)" = pr

  pr-config:
    name: The base-commit run uses the pull request's config
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      - name: A base commit whose config excludes the crate
        id: shop
        run: |
          scripts/action/fixture.sh "$RUNNER_TEMP/shop" config-skew
          echo "base=$(git -C "$RUNNER_TEMP/shop" rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
      - uses: ./
        id: crap
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          base: ${{ steps.shop.outputs.base }}
      - name: Under the base commit's own config every function would be new
        env:
          REPORT: ${{ steps.crap.outputs.report }}
        run: grep -q '★ 0 new' "$REPORT"

  pr-triage:
    name: The base-commit run never pays for triage
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      - name: A pair only the base holds, a new pair in the pull request, triage on
        id: shop
        run: |
          scripts/action/fixture.sh "$RUNNER_TEMP/shop" lone-copy
          printf '[duplicates]\nenabled = true\n\n[duplicates.triage]\nenabled = true\n' \
            > "$RUNNER_TEMP/shop/.cargo-crap.toml"
          echo "base=$(git -C "$RUNNER_TEMP/shop" rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
          python3 scripts/action/stub.py 8765 "$RUNNER_TEMP/api.log" &
          sleep 1
      - uses: ./
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          base: ${{ steps.shop.outputs.base }}
        env:
          TYPESAFE_API_KEY: not-a-key
          TYPESAFE_BASE_URL: http://127.0.0.1:8765
      - name: Only the pull request's new pair was asked about
        run: |
          grep -q 'keep_a' "$RUNNER_TEMP/api.log"
          ! grep -q 'fn two' "$RUNNER_TEMP/api.log"
          ! grep -q '"triage"' "$RUNNER_TEMP"/cargo-crap.*/base.json

  pr-args:
    name: Extra arguments reach cargo-crap
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      - name: A file both commits hold
        id: shop
        run: |
          scripts/action/fixture.sh "$RUNNER_TEMP/shop" extra
          echo "base=$(git -C "$RUNNER_TEMP/shop" rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
      - uses: ./
        id: crap
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          base: ${{ steps.shop.outputs.base }}
          args: --exclude 'src/extra.rs'
      # The comparison would hide a base run that ignored them: the loaded
      # baseline is filtered with the pull request's excludes anyway. So the
      # base run's own record is what is read.
      - name: The base run excluded the file too
        env:
          REPORT: ${{ steps.crap.outputs.report }}
        run: |
          base="$(dirname "$REPORT")/base.json"
          grep -q '"shipping"' "$base"
          ! grep -q 'extra_one' "$base"

  platforms:
    name: It runs on Linux, macOS and Windows runners (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # A pull request, so the base-commit run is exercised on every platform.
      - name: A pull request that only rewords a comment
        id: shop
        shell: bash
        run: |
          scripts/action/fixture.sh "$RUNNER_TEMP/shop" steady
          echo "base=$(git -C "$RUNNER_TEMP/shop" rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
      - uses: ./
        id: crap
        with:
          base: ${{ steps.shop.outputs.base }}
          working-directory: ${{ runner.temp }}/shop
      - name: The comparison was written, back on the pull request's commit
        shell: bash
        env:
          REPORT: ${{ steps.crap.outputs.report }}
        run: |
          grep -q 'No CRAP regressions' "$REPORT"
          test "$(git -C "$RUNNER_TEMP/shop" log -1 --format=%s)" = pr
