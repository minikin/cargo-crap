        run: |
          scripts/action/fixture.sh "$RUNNER_TEMP/shop" steady
          scripts/action/prepared.sh "$RUNNER_TEMP/shop" "$RUNNER_TEMP/bin/cargo-crap"
          python3 scripts/action/stub.py 8765 "$RUNNER_TEMP/api.log" github --anonymous \
            --foreign-bot $'<!-- cargo-crap-report -->\nanother bot\'s report' &
          sleep 1
      - uses: ./
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          lcov: lcov.info
          baseline: base.json
          github-token: fixture-token
      - name: A new comment, and the bot's untouched
        run: |
          grep -q '"method": "POST", "path": "/repos/' "$RUNNER_TEMP/api.log"
          if grep -q '"method": "PATCH"' "$RUNNER_TEMP/api.log"; then exit 1; fi

  comment-refused:
    name: A comment GitHub refuses as too large warns, and the gate decides
    needs: build
    runs-on: ubuntu-latest
