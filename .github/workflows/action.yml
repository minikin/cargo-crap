      - uses: actions/download-artifact@v4
        with:
          name: cargo-crap-under-test
          path: ${{ runner.temp }}/bin
      - name: A config that gates on a threshold both commits cross
        id: shop
        run: |
          scripts/action/fixture.sh "$RUNNER_TEMP/shop" steady
          printf 'fail-above = true\nthreshold = 2\n' > "$RUNNER_TEMP/shop/.cargo-crap.toml"
          echo "base=$(git -C "$RUNNER_TEMP/shop" rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
          python3 scripts/action/stub.py 8765 "$RUNNER_TEMP/api.log" github &
          sleep 1
      - uses: ./
        id: config
        continue-on-error: true
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          base: ${{ steps.shop.outputs.base }}
          github-token: fixture-token
      - uses: ./
        id: args
        continue-on-error: true
        with:
          binary: ${{ runner.temp }}/bin/cargo-crap
          working-directory: ${{ runner.temp }}/shop
          base: ""
          comment: false
          args: --threshold 2 --fail-above
          fail-above: true
      - name: Both failed, after the outputs, the summary and the comment
        env:
          CONFIG: ${{ steps.config.outcome }}
          CONFIG_CRAPPY: ${{ steps.config.outputs.crappy }}
          CONFIG_REPORT: ${{ steps.config.outputs.report }}
          ARGS: ${{ steps.args.outcome }}
          ARGS_CRAPPY: ${{ steps.args.outputs.crappy }}
        run: |
