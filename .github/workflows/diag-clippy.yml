name: Diagnose clippy (temporary)
on:
  push:
    branches: [ci-diagnose-43]
env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: "-D warnings"
jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: clippy findings in one annotation
        run: |
          out=""
          for f in "" "--all-features"; do
            out="$out$(cargo clippy --all-targets $f --message-format short -- -D warnings 2>&1 \
              | grep -E '^(src|tests)/[^:]+:[0-9]+:[0-9]+: (error|warning)' || true)%0A"
          done
          echo "::error title=$(cargo clippy --version)::findings:%0A${out//$'\n'/%0A}"
