name: Release

on:
  push:
    # Version tags only: the Action's moving `v1` tag must never start a
    # release of its own.
    tags: [ "v[0-9]+.[0-9]+.[0-9]+*" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Build binaries for every target platform ──────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cross (aarch64-linux only)
        if: ${{ matrix.use_cross == true }}
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (native)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --features triage --target ${{ matrix.target }}

      - name: Build (cross)
        if: ${{ matrix.use_cross == true }}
        run: cross build --release --features triage --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/cargo-crap"
          ARCHIVE="cargo-crap-${{ matrix.target }}.tar.gz"
          tar czf "$ARCHIVE" -C "$(dirname "$BIN")" "$(basename "$BIN")"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin     = "target\${{ matrix.target }}\release\cargo-crap.exe"
          $archive = "cargo-crap-${{ matrix.target }}.zip"
          Compress-Archive -Path $bin -DestinationPath $archive
          "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  # ── Create a GitHub release and attach all binaries ───────────────────────
  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  # ── Point the Action's v1 tag at this release ─────────────────────────────
  # `uses: minikin/cargo-crap@v1` then installs this release by default:
  # action.yml's default version is held equal to Cargo.toml by a test.
  # GITHUB_TOKEN's push starts no workflow, so this cannot loop.
  # The Action's default version is this release, which exists only now:
  # download it on every platform before `v1` points at it.
  action-smoke:
    name: Action with this release (${{ matrix.os }})
    needs: release
    if: (startsWith(github.ref_name, 'v0.') || startsWith(github.ref_name, 'v1.')) && !contains(github.ref_name, '-')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: A small tested crate
        shell: bash
        run: scripts/action/fixture.sh "$RUNNER_TEMP/shop"
      - uses: ./
        id: crap
        with:
          base: ""
          working-directory: ${{ runner.temp }}/shop
      - name: The release scored it
        shell: bash
        env:
          REPORT: ${{ steps.crap.outputs.report }}
        run: |
          test "$(cargo-crap --version)" = "cargo-crap ${GITHUB_REF_NAME#v}"
          grep -q '`shipping`' "$REPORT"

  # 0.x and 1.x releases only, never a prerelease: an input removed or
  # renamed starts `v2`, and `v2.0.0` must not move `v1`.
  move-v1:
    name: Move the v1 tag
    needs: action-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Point v1 at the release commit
        run: |
          git tag -f v1 "$GITHUB_SHA"
          git push -f origin v1

  # ── Publish to crates.io after the release is live ───────────────────────
  publish:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish
        run: cargo publish --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
