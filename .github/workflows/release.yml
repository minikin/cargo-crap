name: Release

on:
  push:
    # Version tags only: the Action's moving `v1` tag must never start a
    # release of its own.
    tags: [ "v[0-9]+.[0-9]+.[0-9]+*" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: tag
        run: scripts/release/check-tag.sh cargo-crap "$GITHUB_REF_NAME"
      - name: Verify the remote core tag
        run: scripts/release/check-core.sh

  build:
    needs: preflight
    uses: ./.github/workflows/_build.yml
    with:
      package: cargo-crap
      binary: cargo-crap
      features: 'triage'
      targets: >-
        [{"target":"x86_64-unknown-linux-gnu","os":"ubuntu-latest","use_cross":false},
         {"target":"aarch64-unknown-linux-gnu","os":"ubuntu-latest","use_cross":true},
         {"target":"x86_64-apple-darwin","os":"macos-latest","use_cross":false},
         {"target":"aarch64-apple-darwin","os":"macos-latest","use_cross":false},
         {"target":"x86_64-pc-windows-msvc","os":"windows-latest","use_cross":false}]

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: artifacts

      # The Action verifies every archive it installs against this file, and
      # action-smoke below installs from this release, so it ships with it.
      - name: Checksums
        working-directory: artifacts
        run: sha256sum cargo-crap-* > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  action-smoke:
    name: Action with this release (${{ matrix.os }})
    needs: release
    permissions:
      contents: read
    if: (startsWith(github.ref_name, 'v0.') || startsWith(github.ref_name, 'v1.')) && !contains(github.ref_name, '-')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: A small tested crate
        shell: bash
        run: scripts/action/fixture.sh "$RUNNER_TEMP/shop"
      - uses: ./
        id: crap
        with:
          base: ""
          working-directory: ${{ runner.temp }}/shop
      - name: The release scored it
        shell: bash
        env:
          REPORT: ${{ steps.crap.outputs.report }}
        run: |
          test "$(cargo-crap --version)" = "cargo-crap ${GITHUB_REF_NAME#v}"
          grep -q '`shipping`' "$REPORT"

  # 0.x and 1.x releases only, never a prerelease: an input removed or
  # renamed starts `v2`, and `v2.0.0` must not move `v1`.
  move-v1:
    name: Move the v1 tag
    needs: action-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Point v1 at the release commit
        run: |
          git tag -f v1 "$GITHUB_SHA"
          git push -f origin v1

  publish:
    needs: [preflight, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-cargo-crap-core
      cancel-in-progress: false
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify and publish the shared core
        run: scripts/release/publish-core.sh
      - name: Publish cargo-crap
        run: scripts/release/publish-frontend.sh cargo-crap "$VERSION"
