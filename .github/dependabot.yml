{
  "version": 2,
  "updates": [
    {
      "package-ecosystem": "cargo",
      "directory": "/",
      "schedule": { "interval": "weekly" },
      "allow": [
        { "dependency-name": "oxc_*", "dependency-type": "direct" }
      ],
      "groups": {
        "oxc": { "patterns": ["oxc_*"] }
      }
    }
  ]
}
