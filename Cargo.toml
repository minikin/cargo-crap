[package]
name = "cargo-crap"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
authors = ["Oleksandr Prokhorenko <warbles.lieu_04@icloud.com>"]
license = "MIT"
description = "Change Risk Anti-Patterns (CRAP) metric for Rust projects"
repository = "https://github.com/minikin/cargo-crap"
homepage = "https://github.com/minikin/cargo-crap"
documentation = "https://docs.rs/cargo-crap"
readme = "README.md"
exclude = [
    "CLAUDE.md",
    "Justfile",
    "clippy.toml",
    "rustfmt.toml",
    "rust-toolchain.toml",
    "**/.DS_Store",
]
keywords = ["cargo", "code-quality", "coverage", "complexity", "metrics"]
categories = ["development-tools::cargo-plugins", "development-tools::testing"]

[[bin]]
name = "cargo-crap"
path = "src/main.rs"

[lib]
name = "cargo_crap"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.4", features = ["derive"] }
comfy-table = "7"
globset = "0.4"
ignore = "0.4"
rayon = "1"
indicatif = "0.18.4"
lcov = "0.8"
owo-colors = "4"
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
jsonschema = { version = "0.46", default-features = false }

# cargo-binstall: download a pre-built binary instead of compiling from a source.
# Archive naming matches the release workflow: cargo-crap-v{version}-{target}.tar.gz
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/cargo-crap-{ target }.tar.gz"
bin-dir = "cargo-crap{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/cargo-crap-{ target }.zip"
pkg-fmt = "zip"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.mutants]
inherits = "dev"
debug = 0

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Require `#[expect(clippy::rule)]` instead of `#[allow(clippy::rule)]`.
# `expect` errors if the lint stops firing, forcing maintainers to remove
# the attribute when the underlying reason goes away (test no longer
# compares floats, helper no longer takes by value, etc.).
allow_attributes = "warn"
# Require every `#[expect]` / `#[allow]` to carry a `reason = "..."` so
# the rationale lives next to the attribute instead of being lost in a
# commit message.
allow_attributes_without_reason = "warn"

# Pedantic lints we deliberately accept globally:
# `missing_errors_doc`: cargo-crap is a binary tool — most public Result-
#  returning fns are internal pipeline plumbing; an `# Errors` section
#  per fn would be boilerplate that obscures the real docs.
missing_errors_doc = "allow"
# `cast_possible_truncation` / `cast_sign_loss` / `cast_precision_loss`:
# we cast between usize / u32 / f64 deliberately for line numbers (always
# << u32::MAX) and CC scores (small positive integers). The lossiness is
# intentional and load-bearing — narrowing back is the correct semantic.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
# `implicit_hasher`: public APIs take `HashMap<K, V>` rather than
# `HashMap<K, V, S: BuildHasher>` to keep the surface clean. The default
# hasher is the only one anyone passes in practice.
implicit_hasher = "allow"
