[package]
name = "cargo-crap"
version = "0.9.0"
edition.workspace = true
rust-version = "1.88"
authors.workspace = true
license.workspace = true
description = "Change Risk Anti-Patterns (CRAP) metric for Rust projects"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/cargo-crap"
readme = "README.md"
exclude = [
    "CLAUDE.md",
    "KEELER.md",
    "Justfile",
    ".cargo/mutants.toml",
    ".cargo-crap.toml",
    ".claude/",
    ".github/",
    ".idea/",
    "actions/",
    "docs/",
    "npm/",
    "reviews/",
    "scripts/action/crapts/",
    "scripts/gates/",
    "scripts/release/",
    "specs/",
    "tests/",
    "clippy.toml",
    "rustfmt.toml",
    "rust-toolchain.toml",
    "**/.DS_Store",
]
keywords = ["cargo", "code-quality", "coverage", "complexity", "metrics"]
categories = ["development-tools::cargo-plugins", "development-tools::testing"]

# `examples/` and `tests/fixtures/` hold packages of their own. Cargo refuses
# a package under a workspace that neither lists nor excludes it.
[workspace]
members = ["crates/cargo-crap-core", "crates/crapts"]
exclude = ["examples", "tests/fixtures"]
resolver = "3"

# No `version` here: each package carries its own. The goldens record the
# report version as a placeholder only when it equals cargo-crap's, so they
# catch a report stamped by the core only while the two differ.
# `scripts/release/prep.sh` edits the first `version =` line of this file,
# and badges.yml reads the first `license =` line.
[workspace.package]
edition = "2024"
authors = ["Oleksandr Prokhorenko <warbles.lieu_04@icloud.com>"]
license = "MIT"
repository = "https://github.com/minikin/cargo-crap"
homepage = "https://github.com/minikin/cargo-crap"

[workspace.dependencies]
cargo-crap-core = { path = "crates/cargo-crap-core", version = "=0.1.0" }
anyhow = "1"
clap = "4.4"
comfy-table = "7"
globset = "0.4"
ignore = "0.4"
rayon = "1"
indicatif = "0.18.4"
lcov = "0.8"
libc = "0.2"
owo-colors = "4"
oxc_allocator = "=0.159.0"
oxc_ast = "=0.159.0"
oxc_ast_visit = "=0.159.0"
oxc_parser = "=0.159.0"
oxc_span = "=0.159.0"
oxc_str = "=0.159.0"
oxc_syntax = "=0.159.0"
percent-encoding = "2"
proc-macro2 = "1"
serde = "1"
serde_json = "1"
sha2 = { version = "=0.10.9", default-features = false }
quote = "1"
syn = "2"
toml = { version = "0.8", default-features = false }
# Display width of table text, the same measure comfy-table lays out by.
unicode-width = "0.2"
# TypeSafe triage (spec 30): a small blocking client, no gzip.
ureq = { version = "3.4", default-features = false }

tempfile = "3"
assert_cmd = "2"
predicates = "3"
flate2 = { version = "1", default-features = false }
jsonschema = { version = "0.46", default-features = false }
proptest = "1.11.0"
# Scheme 1's reference tables must stay on Unicode 16.0.0.
regex-syntax = "=0.8.12"
# Snapshots of the human tables at fixed widths (spec 20).
insta = "1"

[[bin]]
name = "cargo-crap"
path = "src/main.rs"

[lib]
name = "cargo_crap"
path = "src/lib.rs"

[dependencies]
cargo-crap-core.workspace = true
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
globset.workspace = true
ignore.workspace = true
rayon.workspace = true
indicatif.workspace = true
proc-macro2 = { workspace = true, features = ["span-locations"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["float_roundtrip"] }
quote.workspace = true
syn = { workspace = true, features = ["full", "visit", "printing"] }
toml = { workspace = true, features = ["parse"] }
ureq = { workspace = true, optional = true, features = ["rustls"] }

[features]
# Duplicate-pair triage by a TypeSafe model (spec 30). Off by default: a plain
# `cargo install cargo-crap` compiles no HTTP client and no TLS stack. The
# release binaries are built with it.
triage = ["dep:ureq"]

[dev-dependencies]
tempfile.workspace = true
assert_cmd.workspace = true
predicates.workspace = true
jsonschema.workspace = true
proptest.workspace = true
insta.workspace = true
unicode-width.workspace = true

# docs.rs documents every feature, so the triage client appears in the docs.
[package.metadata.docs.rs]
all-features = true

# cargo-binstall: download a pre-built binary instead of compiling from a source.
# Archive naming matches the release workflow: cargo-crap-{target}.tar.gz
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/cargo-crap-{ target }.tar.gz"
bin-dir = "cargo-crap{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/cargo-crap-{ target }.zip"
pkg-fmt = "zip"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.mutants]
inherits = "dev"
debug = 0

[lints]
workspace = true

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Require `#[expect(clippy::rule)]` instead of `#[allow(clippy::rule)]`.
# `expect` errors if the lint stops firing, forcing maintainers to remove
# the attribute when the underlying reason goes away (test no longer
# compares floats, helper no longer takes by value, etc.).
allow_attributes = "warn"
# Require every `#[expect]` / `#[allow]` to carry a `reason = "..."` so
# the rationale lives next to the attribute instead of being lost in a
# commit message.
allow_attributes_without_reason = "warn"

# Pedantic lints we deliberately accept globally:
# `missing_errors_doc`: cargo-crap is a binary tool — most public Result-
#  returning fns are internal pipeline plumbing; an `# Errors` section
#  per fn would be boilerplate that obscures the real docs.
missing_errors_doc = "allow"
# `cast_possible_truncation` / `cast_sign_loss` / `cast_precision_loss`:
# we cast between usize / u32 / f64 deliberately for line numbers (always
# << u32::MAX) and CC scores (small positive integers). The lossiness is
# intentional and load-bearing — narrowing back is the correct semantic.
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
# `implicit_hasher`: public APIs take `HashMap<K, V>` rather than
# `HashMap<K, V, S: BuildHasher>` to keep the surface clean. The default
# hasher is the only one anyone passes in practice.
implicit_hasher = "allow"
